name: Actualizar dashboard

on:
  schedule:
    # Corre cada 5 minutos (el mínimo que permite GitHub Actions) para que el
    # desfase entre HubSpot y el dashboard sea de unos 6-7 minutos como
    # máximo, contando lo que tarda en correr. Ajusta el cron si en algún
    # momento quieres más o menos frecuencia — OJO: GitHub puede demorar un
    # poco más la ejecución en horas de mucho tráfico, así que 5 minutos es
    # el mejor esfuerzo, no una garantía exacta.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Traer leads de HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_hubspot.py

      - name: Traer gasto de Meta Ads
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/fetch_meta.py

      - name: Traer contenido orgánico (Facebook e Instagram)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python scripts/fetch_organic.py

      - name: Mandar retroalimentación de calidad de leads a Meta
        env:
          META_OFFLINE_TOKEN: ${{ secrets.META_OFFLINE_TOKEN }}
        run: python scripts/send_meta_offline_events.py

      - name: Guardar los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json meta_data.json organic_data.json
          if [ -f meta_events_state.json ]; then git add meta_events_state.json; fi
          git diff --staged --quiet || git commit -m "Actualiza datos del dashboard"
          git push
