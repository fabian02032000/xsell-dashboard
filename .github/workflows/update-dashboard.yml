name: Actualizar dashboard

on:
  schedule:
    # Corre cada hora, en el minuto 0. Ajusta el cron si quieres más o menos frecuencia.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Traer leads de HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_hubspot.py

      - name: Traer correos de prospección en frío (Ingrid)
        # continue-on-error: si al token de HubSpot le falta el permiso de
        # leer correos (ver README.md), este paso falla pero NO debe frenar
        # el resto del dashboard — los demás datos deben seguir actualizándose.
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_ingrid_emails.py

      - name: Traer gasto de Meta Ads
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/fetch_meta.py

      - name: Traer contenido orgánico (Facebook e Instagram)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python scripts/fetch_organic.py

      - name: Mandar retroalimentación de calidad de leads a Meta
        env:
          META_OFFLINE_TOKEN: ${{ secrets.META_OFFLINE_TOKEN }}
        run: python scripts/send_meta_offline_events.py

      - name: Guardar los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json meta_data.json organic_data.json
          if [ -f emails_data.json ]; then git add emails_data.json; fi
          if [ -f meta_events_state.json ]; then git add meta_events_state.json; fi
          git diff --staged --quiet || git commit -m "Actualiza datos del dashboard"
          git push
