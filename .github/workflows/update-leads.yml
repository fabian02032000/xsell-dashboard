name: Actualizar leads (frecuente)

on:
  schedule:
    # Corre cada 10 minutos, solo para traer los leads/negocios de HubSpot
    # (incluye Estadio del Lead y Nivel de Urgencia). Así se reflejan casi
    # al instante después de que Ingrid tipifica un negocio, sin tener que
    # esperar el ciclo de 1 hora del workflow "Actualizar dashboard" (que
    # además trae gasto de Meta Ads y contenido orgánico, y no hace falta
    # correr eso cada 10 minutos).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Traer leads de HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_hubspot.py

      - name: Guardar los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los leads, no hay nada que subir."
          else
            git commit -m "Actualiza leads (Estadio del Lead / Nivel de Urgencia)"
            git pull --rebase
            git push
          fi
